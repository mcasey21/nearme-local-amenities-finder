
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Proximity Search</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div id="map"></div>

    <div class="control-panel">
        <h3>City Search</h3>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search cities..."
        >

        <hr>

        <h3>Spatial Proximity Search</h3>
        <p id="originStatus">Select a city marker to choose a search origin.</p>

        <button id="nearestBtn" disabled>
            Find 10 Nearest Cities
        </button>

        <div class="radius-controls">
            <label for="radiusInput">Search radius (km)</label>
            <input
                type="number"
                id="radiusInput"
                value="500"
                min="0.1"
                max="20000"
                step="any"
            >
            <button id="radiusBtn" disabled>
                Search Radius
            </button>
        </div>

        <div id="proximityStatus" role="status"></div>
        <div id="proximityResults"></div>

        <hr>

        <button id="resetBtn">Reset View</button>
        <div id="results"></div>
    </div>

    <div class="info-box">
        <h4>Map Information</h4>
        <p>Cities loaded: <strong id="cityCount">0</strong></p>
        <p>Click a city marker to choose a search origin.</p>
    </div>

    <div class="loading" id="loading">
        Loading cities data...
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
