
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearMe - Sign In</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <h1>NearMe</h1>
            <h2>Sign In</h2>

            {% if form.errors %}
                <p style="color: red;">
                    Invalid username or password. Please try again.
                </p>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <label for="id_username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    required
                >

                <label for="id_password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    required
                >

                <button type="submit">Sign In</button>
            </form>

            <p>
                <a href="/">Back to NearMe</a>
            </p>

        </div>
    </div>

</body>
</html>
